<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Anand Karaj artwork — Nirman and Simran circling the Guru Granth Sahib in the four laavan pheris, framed by a gold phulkari border">
  <defs>
    <pattern id="phulkari" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#6d1a2d"/>
      <path d="M16 2 L19 13 L30 16 L19 19 L16 30 L13 19 L2 16 L13 13 Z" fill="#c8a24b"/>
      <path d="M16 8 L17.5 14.5 L24 16 L17.5 17.5 L16 24 L14.5 17.5 L8 16 L14.5 14.5 Z" fill="#f6e2a1"/>
      <circle cx="16" cy="16" r="2" fill="#a4243b"/>
    </pattern>
    <linearGradient id="canopyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a4243b"/>
      <stop offset="1" stop-color="#6d1a2d"/>
    </linearGradient>
  </defs>

  <!-- Phulkari border -->
  <rect x="0" y="0" width="400" height="320" fill="url(#phulkari)"/>
  <rect x="10" y="10" width="380" height="300" fill="#faf6ec"/>
  <rect x="10" y="10" width="380" height="300" fill="none" stroke="#b8862e" stroke-width="2"/>
  <rect x="15" y="15" width="370" height="290" fill="none" stroke="#e3d5b3" stroke-width="1"/>

  <!-- Khanda -->
  <g transform="translate(200 36)" fill="#b8862e">
    <circle cx="0" cy="-9" r="3.4" fill="none" stroke="#b8862e" stroke-width="1.8"/>
    <path d="M0 -6 L2.4 4 L2.4 13 L-2.4 13 L-2.4 4 Z"/>
    <path d="M-4.5 13 L4.5 13 L3.2 15.4 L-3.2 15.4 Z"/>
    <path d="M-10 -9 Q-7.6 1 -4.6 13 L-1.8 13 Q-4.6 1 -6.4 -6.4 Z"/>
    <path d="M10 -9 Q7.6 1 4.6 13 L1.8 13 Q4.6 1 6.4 -6.4 Z"/>
  </g>

  <!-- Laavan path (four pheris) -->
  <ellipse cx="200" cy="208" rx="118" ry="58" fill="none" stroke="#c8a24b" stroke-width="2" stroke-dasharray="7 7" opacity="0.75"/>
  <circle cx="200" cy="150" r="4.6" fill="#a4243b"/>
  <circle cx="318" cy="208" r="4.6" fill="#a4243b"/>
  <circle cx="200" cy="266" r="4.6" fill="#a4243b"/>
  <circle cx="82" cy="208" r="4.6" fill="#a4243b"/>

  <!-- Canopy (chanani) over the Guru Granth Sahib -->
  <path d="M164 86 Q200 46 236 86 L231 98 L169 98 Z" fill="url(#canopyG)"/>
  <path d="M164 86 Q200 46 236 86" fill="none" stroke="#e5c46d" stroke-width="1.4"/>
  <line x1="171" y1="98" x2="171" y2="122" stroke="#b8862e" stroke-width="2.2"/>
  <line x1="229" y1="98" x2="229" y2="122" stroke="#b8862e" stroke-width="2.2"/>

  <!-- Manji sahib (raised platform) -->
  <rect x="152" y="122" width="96" height="9" rx="3" fill="#8c2340"/>
  <rect x="147" y="131" width="106" height="8" rx="3" fill="#4a1220"/>

  <!-- Guru Granth Sahib -->
  <rect x="160" y="106" width="80" height="16" rx="3" fill="#4a1220" stroke="#c8a24b" stroke-width="1.6"/>
  <rect x="160" y="106" width="80" height="5" rx="2.4" fill="#8c2340"/>
  <line x1="200" y1="122" x2="200" y2="128" stroke="#c8a24b" stroke-width="2"/>
  <circle cx="200" cy="130" r="1.8" fill="#c8a24b"/>

  <!-- Joined hands -->
  <path d="M183 158 Q200 167 217 158" fill="none" stroke="#b07a4e" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="200" cy="162.5" r="3.6" fill="#b8862e"/>

  <!-- Groom (sherwani + turban) -->
  <g transform="translate(168 150)">
    <path d="M0 -32 C-9 -28 -13 -17 -13 -5 L-15 24 L-7 24 L-5 6 L-3 24 L3 24 L5 6 L7 24 L15 24 L13 -5 C13 -17 9 -28 0 -32 Z" fill="#4a1220"/>
    <path d="M-13 -6 L13 -6 L13 -2 L-13 -2 Z" fill="#c8a24b"/>
    <circle cx="1" cy="-38" r="6.5" fill="#b07a4e"/>
    <path d="M-6.5 -41 Q1 -54 8.5 -41 L8.5 -37.5 L-6.5 -37.5 Z" fill="#c8a24b"/>
  </g>

  <!-- Bride (lehenga + chunni) -->
  <g transform="translate(232 150)">
    <path d="M0 -32 C-8 -28 -10 -18 -10 -10 C-18 4 -28 18 -30 28 L30 28 C28 18 18 4 10 -10 C10 -18 8 -28 0 -32 Z" fill="#6d1a2d"/>
    <path d="M-30 28 L30 28 L28 32.5 L-28 32.5 Z" fill="#b8862e"/>
    <circle cx="-1" cy="-38" r="6.5" fill="#b07a4e"/>
    <path d="M-8.5 -41 Q-1 -55 6.5 -41 L9.5 -29 L-9.5 -29 Z" fill="#c8a24b"/>
    <path d="M-9.5 -29 L9.5 -29 L6 -21 L-6 -21 Z" fill="#a4243b"/>
  </g>

  <!-- Diyas -->
  <g transform="translate(126 200)">
    <ellipse cx="0" cy="0" rx="9" ry="4" fill="#8c2340"/>
    <path d="M0 -15 C3.4 -9 3.4 -5 0 -2.4 C-3.4 -5 -3.4 -9 0 -15 Z" fill="#e5c46d"/>
    <circle cx="0" cy="-7" r="1.7" fill="#a4243b"/>
  </g>
  <g transform="translate(274 200)">
    <ellipse cx="0" cy="0" rx="9" ry="4" fill="#8c2340"/>
    <path d="M0 -15 C3.4 -9 3.4 -5 0 -2.4 C-3.4 -5 -3.4 -9 0 -15 Z" fill="#e5c46d"/>
    <circle cx="0" cy="-7" r="1.7" fill="#a4243b"/>
  </g>

  <!-- Marigolds -->
  <g transform="translate(42 44)">
    <circle cx="0" cy="0" r="7" fill="#d98e32"/>
    <circle cx="-6" cy="3" r="5.5" fill="#c8a24b"/>
    <circle cx="6" cy="3" r="5.5" fill="#c8a24b"/>
    <circle cx="-3" cy="-5" r="5.5" fill="#e5c46d"/>
    <circle cx="4" cy="-4" r="5" fill="#b8862e"/>
    <circle cx="0" cy="1" r="3" fill="#a4243b"/>
  </g>
  <g transform="translate(358 44)">
    <circle cx="0" cy="0" r="7" fill="#d98e32"/>
    <circle cx="-6" cy="3" r="5.5" fill="#c8a24b"/>
    <circle cx="6" cy="3" r="5.5" fill="#c8a24b"/>
    <circle cx="-3" cy="-5" r="5.5" fill="#e5c46d"/>
    <circle cx="4" cy="-4" r="5" fill="#b8862e"/>
    <circle cx="0" cy="1" r="3" fill="#a4243b"/>
  </g>
  <g transform="translate(42 276)">
    <circle cx="0" cy="0" r="7" fill="#d98e32"/>
    <circle cx="-6" cy="3" r="5.5" fill="#c8a24b"/>
    <circle cx="6" cy="3" r="5.5" fill="#c8a24b"/>
    <circle cx="-3" cy="-5" r="5.5" fill="#e5c46d"/>
    <circle cx="4" cy="-4" r="5" fill="#b8862e"/>
    <circle cx="0" cy="1" r="3" fill="#a4243b"/>
  </g>
  <g transform="translate(358 276)">
    <circle cx="0" cy="0" r="7" fill="#d98e32"/>
    <circle cx="-6" cy="3" r="5.5" fill="#c8a24b"/>
    <circle cx="6" cy="3" r="5.5" fill="#c8a24b"/>
    <circle cx="-3" cy="-5" r="5.5" fill="#e5c46d"/>
    <circle cx="4" cy="-4" r="5" fill="#b8862e"/>
    <circle cx="0" cy="1" r="3" fill="#a4243b"/>
  </g>
</svg>
