<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Ornamental corner">
  <defs>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5c46d"/>
      <stop offset="55%" stop-color="#c8a24b"/>
      <stop offset="100%" stop-color="#a8812e"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#cg)" stroke-width="1.6" stroke-linecap="round">
    <!-- corner sweep -->
    <path d="M4 40 C4 18 18 4 40 4"/>
    <path d="M4 58 C4 26 26 4 58 4" stroke-width="0.9" opacity="0.75"/>
    <!-- inner echo -->
    <path d="M14 40 C14 24 24 14 40 14" stroke-width="0.9" opacity="0.6"/>
    <!-- lotus at the apex -->
    <path d="M40 4 C46 10 46 16 40 20 C34 16 34 10 40 4 Z" fill="url(#cg)" stroke="none"/>
    <!-- paisley leaf -->
    <path d="M22 22 C30 22 34 28 34 34 C28 34 22 30 22 22 Z" fill="url(#cg)" fill-opacity="0.5" stroke="none"/>
    <path d="M22 34 C28 38 32 44 30 50" stroke-width="1.1"/>
    <!-- small buds -->
    <circle cx="12" cy="12" r="2.2" fill="url(#cg)" stroke="none"/>
    <circle cx="50" cy="12" r="1.6" fill="url(#cg)" stroke="none" opacity="0.8"/>
    <circle cx="12" cy="50" r="1.6" fill="url(#cg)" stroke="none" opacity="0.8"/>
    <!-- fine dots trailing the sweep -->
    <g fill="url(#cg)" stroke="none" opacity="0.65">
      <circle cx="62" cy="4" r="1.1"/>
      <circle cx="70" cy="6" r="0.9"/>
      <circle cx="4" cy="62" r="1.1"/>
      <circle cx="6" cy="70" r="0.9"/>
    </g>
  </g>
</svg>